name: Build and Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Prettier Check
        run: yarn prettier:check

  test:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
        with:
          fetch-depth: 0

      - name: Fetch all history for all tags and branches
        run: git fetch

      - name: Install Dependencies
        run: yarn

      - name: Build
        run: yarn build:ci

      - name: Test
        run: yarn test:ci:changed