name: Publish

on: 
  workflow_dispatch:
    inputs:
      semanticVersion:
        description: 'Semantic Version [major | minor | patch ]'
        required: true
        default: 'patch'

permissions:
  contents: read

jobs:
  Publish:
    name: Publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
        with:
          token: ${{ secrets.ADMIN_TOKEN }}
          ref: 'main'
          # pulls all commits (needed for lerna / semantic release to correctly version)
          fetch-depth: '0'

      - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org/

      - name: Configure CI Git User
        run: |
          git config --global user.name 'Justin Smith'
          git config --global user.email 'justindsmith@gmail.com'
      - name: Install Packages
        run: yarn install

      - name: Build
        run: yarn build

      - name: Authenticate with Registry
        run: |
          yarn logout
          echo "registry=http://registry.npmjs.org/" >> .npmrc
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> .npmrc
          npm whoami
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish package
        run: |
          yarn publish:ci ${{ github.event.inputs.semanticVersion }}
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}